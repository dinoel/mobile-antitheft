<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Do Not Touch My Phone</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: #000; height: 100%; overscroll-behavior: none; }
    body { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
    #root { min-height: 100vh; min-height: 100dvh; }
    button { font-family: inherit; cursor: pointer; }
    @keyframes blink { to { visibility: hidden; } }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect, useRef, useCallback } = React;

    const DEFAULT_GRACE_SEC = 5;
    const ARM_DELAY_MS = 3000;
    const DEFAULT_THRESHOLD = 1.5;

    function AntiTheftApp() {
      const [stage, setStage] = useState('SETUP');
      const [savedPin, setSavedPin] = useState(null);
      const [pinBuffer, setPinBuffer] = useState('');
      const [confirmBuffer, setConfirmBuffer] = useState('');
      const [error, setError] = useState('');
      const [threshold, setThreshold] = useState(DEFAULT_THRESHOLD);
      const [graceSec, setGraceSec] = useState(DEFAULT_GRACE_SEC);
      const [armCountdown, setArmCountdown] = useState(0);
      const [graceMs, setGraceMs] = useState(DEFAULT_GRACE_SEC * 1000);
      const [motionLevel, setMotionLevel] = useState(0);
      const [sensorStatus, setSensorStatus] = useState('idle');

      const audioCtxRef = useRef(null);
      const sirenNodesRef = useRef(null);
      const wakeLockRef = useRef(null);
      const baselineRef = useRef({ x: 0, y: 0, z: 9.8 });
      const calibrationSamplesRef = useRef([]);
      const motionHandlerRef = useRef(null);
      const graceIntervalRef = useRef(null);
      const armIntervalRef = useRef(null);
      const stageRef = useRef(stage);
      const thresholdRef = useRef(threshold);
      const graceSecRef = useRef(graceSec);

      useEffect(() => { stageRef.current = stage; }, [stage]);
      useEffect(() => { thresholdRef.current = threshold; }, [threshold]);
      useEffect(() => { graceSecRef.current = graceSec; }, [graceSec]);

      const requestWakeLock = useCallback(async () => {
        try {
          if ('wakeLock' in navigator) {
            wakeLockRef.current = await navigator.wakeLock.request('screen');
          }
        } catch (e) {}
      }, []);

      const releaseWakeLock = useCallback(() => {
        if (wakeLockRef.current) {
          wakeLockRef.current.release().catch(() => {});
          wakeLockRef.current = null;
        }
      }, []);

      const startSiren = useCallback(() => {
        if (sirenNodesRef.current) return;
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ctx = audioCtxRef.current || new Ctx();
        audioCtxRef.current = ctx;
        if (ctx.state === 'suspended') ctx.resume();

        const osc = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();
        const lfo = ctx.createOscillator();
        const lfoGain = ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.value = 700;
        osc2.type = 'square';
        osc2.frequency.value = 350;

        lfo.type = 'triangle';
        lfo.frequency.value = 3.5;
        lfoGain.gain.value = 500;

        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);
        lfoGain.connect(osc2.frequency);

        osc.connect(gain);
        osc2.connect(gain);
        gain.gain.value = 0.85;
        gain.connect(ctx.destination);

        osc.start();
        osc2.start();
        lfo.start();

        sirenNodesRef.current = { osc, osc2, lfo, gain };
      }, []);

      const stopSiren = useCallback(() => {
        const nodes = sirenNodesRef.current;
        if (!nodes) return;
        try {
          nodes.gain.gain.exponentialRampToValueAtTime(0.0001, audioCtxRef.current.currentTime + 0.15);
          setTimeout(() => {
            try { nodes.osc.stop(); nodes.osc2.stop(); nodes.lfo.stop(); } catch (e) {}
          }, 200);
        } catch (e) {}
        sirenNodesRef.current = null;
      }, []);

      const beep = useCallback((freq = 880, dur = 0.08) => {
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          const ctx = audioCtxRef.current || new Ctx();
          audioCtxRef.current = ctx;
          if (ctx.state === 'suspended') ctx.resume();
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'square';
          o.frequency.value = freq;
          g.gain.value = 0.15;
          o.connect(g); g.connect(ctx.destination);
          o.start();
          o.stop(ctx.currentTime + dur);
        } catch (e) {}
      }, []);

      const onMotion = useCallback((event) => {
        const a = event.accelerationIncludingGravity || event.acceleration;
        if (!a || a.x == null) return;
        const { x, y, z } = a;

        if (calibrationSamplesRef.current && calibrationSamplesRef.current.length < 10) {
          calibrationSamplesRef.current.push({ x, y, z });
          if (calibrationSamplesRef.current.length === 10) {
            const n = calibrationSamplesRef.current.length;
            baselineRef.current = {
              x: calibrationSamplesRef.current.reduce((s, v) => s + v.x, 0) / n,
              y: calibrationSamplesRef.current.reduce((s, v) => s + v.y, 0) / n,
              z: calibrationSamplesRef.current.reduce((s, v) => s + v.z, 0) / n,
            };
          }
          return;
        }

        const b = baselineRef.current;
        const dx = x - b.x, dy = y - b.y, dz = z - b.z;
        const delta = Math.sqrt(dx * dx + dy * dy + dz * dz);
        setMotionLevel(delta);

        if (stageRef.current === 'ARMED' && delta > thresholdRef.current) {
          triggerGracePeriod();
        }
      }, []);

      const requestMotionPermission = useCallback(async () => {
        setSensorStatus('requesting');
        if (typeof DeviceMotionEvent === 'undefined') {
          setSensorStatus('unsupported');
          return false;
        }
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
          try {
            const res = await DeviceMotionEvent.requestPermission();
            if (res === 'granted') { setSensorStatus('active'); return true; }
            setSensorStatus('denied');
            return false;
          } catch (e) {
            setSensorStatus('denied');
            return false;
          }
        }
        setSensorStatus('active');
        return true;
      }, []);

      const attachMotion = useCallback(() => {
        if (motionHandlerRef.current) return;
        calibrationSamplesRef.current = [];
        motionHandlerRef.current = onMotion;
        window.addEventListener('devicemotion', motionHandlerRef.current);
      }, [onMotion]);

      const detachMotion = useCallback(() => {
        if (motionHandlerRef.current) {
          window.removeEventListener('devicemotion', motionHandlerRef.current);
          motionHandlerRef.current = null;
        }
        setMotionLevel(0);
      }, []);

      const triggerGracePeriod = useCallback(() => {
        if (stageRef.current !== 'ARMED') return;
        const totalMs = graceSecRef.current * 1000;
        setStage('TRIGGERED');
        setGraceMs(totalMs);
        setPinBuffer('');
        setError('');
        const startedAt = Date.now();
        if (graceIntervalRef.current) clearInterval(graceIntervalRef.current);
        graceIntervalRef.current = setInterval(() => {
          const remaining = totalMs - (Date.now() - startedAt);
          if (remaining <= 0) {
            clearInterval(graceIntervalRef.current);
            graceIntervalRef.current = null;
            setGraceMs(0);
            setStage('ALARM');
            startSiren();
          } else {
            setGraceMs(remaining);
            if (Math.floor(remaining / 1000) !== Math.floor((remaining + 80) / 1000)) {
              beep(1400, 0.05);
            }
          }
        }, 50);
      }, [startSiren, beep]);

      const beginArming = useCallback(async () => {
        setError('');
        const ok = await requestMotionPermission();
        if (!ok) {
          setError('Нет доступа к акселерометру. Разреши в настройках Safari.');
          return;
        }
        beep(660, 0.05);
        await requestWakeLock();

        setStage('ARMING');
        setArmCountdown(Math.ceil(ARM_DELAY_MS / 1000));
        const startedAt = Date.now();
        if (armIntervalRef.current) clearInterval(armIntervalRef.current);
        armIntervalRef.current = setInterval(() => {
          const elapsed = Date.now() - startedAt;
          const remaining = Math.max(0, ARM_DELAY_MS - elapsed);
          const sec = Math.ceil(remaining / 1000);
          setArmCountdown(prev => {
            if (sec !== prev) beep(sec === 0 ? 1320 : 880, 0.08);
            return sec;
          });
          if (remaining <= 0) {
            clearInterval(armIntervalRef.current);
            armIntervalRef.current = null;
            attachMotion();
            setStage('ARMED');
          }
        }, 100);
      }, [requestMotionPermission, requestWakeLock, attachMotion, beep]);

      const disarm = useCallback(() => {
        if (armIntervalRef.current) { clearInterval(armIntervalRef.current); armIntervalRef.current = null; }
        if (graceIntervalRef.current) { clearInterval(graceIntervalRef.current); graceIntervalRef.current = null; }
        stopSiren();
        detachMotion();
        releaseWakeLock();
        setPinBuffer('');
        setError('');
        setStage('DISARMED');
      }, [stopSiren, detachMotion, releaseWakeLock]);

      const onDigit = (d) => {
        setError('');
        if (stage === 'SETUP') {
          if (pinBuffer.length < 6) setPinBuffer(pinBuffer + d);
        } else if (stage === 'CONFIRM') {
          if (confirmBuffer.length < 6) setConfirmBuffer(confirmBuffer + d);
        } else {
          if (pinBuffer.length < 6) setPinBuffer(pinBuffer + d);
        }
      };

      const onDelete = () => {
        setError('');
        if (stage === 'SETUP') setPinBuffer(pinBuffer.slice(0, -1));
        else if (stage === 'CONFIRM') setConfirmBuffer(confirmBuffer.slice(0, -1));
        else setPinBuffer(pinBuffer.slice(0, -1));
      };

      const onSubmit = () => {
        if (stage === 'SETUP') {
          if (pinBuffer.length < 4) { setError('Минимум 4 цифры'); return; }
          setStage('CONFIRM');
          return;
        }
        if (stage === 'CONFIRM') {
          if (confirmBuffer !== pinBuffer) {
            setError('PIN не совпадает');
            setConfirmBuffer('');
            return;
          }
          setSavedPin(pinBuffer);
          setPinBuffer('');
          setConfirmBuffer('');
          setStage('DISARMED');
          return;
        }
        if (pinBuffer === savedPin) {
          disarm();
        } else {
          setError('Неверный PIN');
          setPinBuffer('');
        }
      };

      useEffect(() => {
        if ((stage === 'TRIGGERED' || stage === 'ALARM') && savedPin && pinBuffer.length === savedPin.length) {
          onSubmit();
        }
      }, [pinBuffer, stage, savedPin]);

      useEffect(() => () => {
        if (graceIntervalRef.current) clearInterval(graceIntervalRef.current);
        if (armIntervalRef.current) clearInterval(armIntervalRef.current);
        detachMotion();
        stopSiren();
        releaseWakeLock();
      }, []);

      useEffect(() => {
        const handler = async () => {
          if (document.visibilityState === 'visible' && (stage === 'ARMED' || stage === 'TRIGGERED' || stage === 'ALARM')) {
            await requestWakeLock();
          }
        };
        document.addEventListener('visibilitychange', handler);
        return () => document.removeEventListener('visibilitychange', handler);
      }, [stage, requestWakeLock]);

      const palette = {
        SETUP:     { primary: '#00ff9c', shadow: 'rgba(0,255,156,0.35)', label: 'УСТАНОВКА PIN' },
        CONFIRM:   { primary: '#00ff9c', shadow: 'rgba(0,255,156,0.35)', label: 'ПОВТОРИТЕ PIN' },
        DISARMED:  { primary: '#00ff9c', shadow: 'rgba(0,255,156,0.35)', label: 'СНЯТО С ОХРАНЫ' },
        ARMING:    { primary: '#ffb000', shadow: 'rgba(255,176,0,0.4)',  label: 'ПОСТАНОВКА...' },
        ARMED:     { primary: '#ffb000', shadow: 'rgba(255,176,0,0.5)',  label: 'ПОД ОХРАНОЙ' },
        TRIGGERED: { primary: '#ff3344', shadow: 'rgba(255,51,68,0.55)', label: 'ВЗЛОМ! ВВЕДИ PIN' },
        ALARM:     { primary: '#ff003c', shadow: 'rgba(255,0,60,0.7)',   label: 'ТРЕВОГА' },
      }[stage];

      const currentBuffer = stage === 'CONFIRM' ? confirmBuffer : pinBuffer;
      const blink = stage === 'TRIGGERED' || stage === 'ALARM' || stage === 'ARMING';
      const graceFrac = Math.max(0, Math.min(1, graceMs / (graceSec * 1000)));

      return (
        <div style={{
          minHeight: '100dvh',
          background: 'radial-gradient(ellipse at top, #15110a 0%, #060403 60%, #000 100%)',
          color: palette.primary,
          padding: '16px',
          paddingTop: 'max(16px, env(safe-area-inset-top))',
          paddingBottom: 'max(16px, env(safe-area-inset-bottom))',
          position: 'relative',
          overflow: 'hidden',
        }}>
          <div style={{
            position: 'fixed', inset: 0, pointerEvents: 'none',
            backgroundImage: 'repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 1px, transparent 3px)',
            zIndex: 1,
          }} />

          <div style={{ position: 'relative', zIndex: 2, maxWidth: 460, margin: '0 auto' }}>

            <div style={{
              display: 'flex', justifyContent: 'space-between', alignItems: 'center',
              borderBottom: `1px solid ${palette.primary}40`,
              paddingBottom: 8, marginBottom: 16,
              fontSize: 11, letterSpacing: '0.2em', textTransform: 'uppercase',
              opacity: 0.7,
            }}>
              <span>DO·NOT·TOUCH</span>
              <span>v1.0 / СТРАЖ</span>
            </div>

            <div style={{
              border: `2px solid ${palette.primary}`,
              borderRadius: 4,
              padding: '20px 16px',
              background: '#000',
              boxShadow: `0 0 24px ${palette.shadow}, inset 0 0 16px ${palette.shadow}`,
              textAlign: 'center',
              marginBottom: 16,
            }}>
              <div style={{ fontSize: 11, letterSpacing: '0.35em', opacity: 0.7, marginBottom: 8 }}>СТАТУС</div>
              <div style={{
                fontSize: 22, fontWeight: 700, letterSpacing: '0.15em',
                textShadow: `0 0 12px ${palette.primary}`,
                animation: blink ? 'blink 0.8s steps(2,start) infinite' : 'none',
              }}>{palette.label}</div>

              {stage === 'ARMING' && (
                <div style={{ fontSize: 64, fontWeight: 900, marginTop: 12, textShadow: `0 0 20px ${palette.primary}` }}>
                  {armCountdown}
                </div>
              )}

              {stage === 'TRIGGERED' && (
                <div style={{ marginTop: 14 }}>
                  <div style={{ fontSize: 56, fontWeight: 900, textShadow: `0 0 20px ${palette.primary}` }}>
                    {(graceMs / 1000).toFixed(1)}
                  </div>
                  <div style={{ fontSize: 10, letterSpacing: '0.3em', opacity: 0.75, marginTop: 4 }}>
                    СЕКУНД ДО СИРЕНЫ
                  </div>
                  <div style={{
                    marginTop: 10, height: 4, background: `${palette.primary}22`, borderRadius: 2, overflow: 'hidden',
                  }}>
                    <div style={{
                      width: `${graceFrac * 100}%`, height: '100%', background: palette.primary,
                      boxShadow: `0 0 8px ${palette.primary}`, transition: 'width 50ms linear',
                    }} />
                  </div>
                </div>
              )}

              {stage === 'ARMED' && (
                <div style={{ marginTop: 14, fontSize: 10, letterSpacing: '0.25em', opacity: 0.75 }}>
                  ПОРОГ {threshold.toFixed(1)} м/с² · УРОВЕНЬ {motionLevel.toFixed(2)}
                </div>
              )}
            </div>

            {(stage === 'ARMED' || stage === 'TRIGGERED') && (
              <div style={{
                border: `1px solid ${palette.primary}55`, borderRadius: 3, padding: 10, marginBottom: 14,
                background: '#000',
              }}>
                <div style={{ fontSize: 10, letterSpacing: '0.3em', opacity: 0.6, marginBottom: 6 }}>ДВИЖЕНИЕ</div>
                <div style={{ height: 8, background: `${palette.primary}15`, borderRadius: 2, position: 'relative', overflow: 'hidden' }}>
                  <div style={{
                    width: `${Math.min(100, (motionLevel / (threshold * 2)) * 100)}%`,
                    height: '100%',
                    background: motionLevel > threshold ? '#ff3344' : palette.primary,
                    boxShadow: `0 0 6px ${motionLevel > threshold ? '#ff3344' : palette.primary}`,
                    transition: 'width 50ms linear',
                  }} />
                  <div style={{
                    position: 'absolute', top: -2, bottom: -2,
                    left: `${(threshold / (threshold * 2)) * 100}%`,
                    width: 2, background: '#fff', opacity: 0.4,
                  }} />
                </div>
              </div>
            )}

            {(stage === 'SETUP' || stage === 'CONFIRM' || stage === 'DISARMED' || stage === 'TRIGGERED' || stage === 'ALARM') && (
              <>
                <div style={{
                  border: `1px solid ${palette.primary}55`,
                  borderRadius: 3,
                  padding: '14px 12px',
                  background: '#000',
                  marginBottom: 12,
                  textAlign: 'center',
                  fontSize: 28, letterSpacing: '0.6em',
                  minHeight: 32,
                  textShadow: `0 0 10px ${palette.primary}`,
                }}>
                  {currentBuffer.split('').map(() => '●').join('') || <span style={{ opacity: 0.25 }}>______</span>}
                </div>

                {error && (
                  <div style={{
                    color: '#ff5566', fontSize: 12, letterSpacing: '0.15em',
                    textAlign: 'center', marginBottom: 10, textTransform: 'uppercase',
                  }}>{error}</div>
                )}

                <div style={{
                  display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8,
                  marginBottom: 14,
                }}>
                  {[1,2,3,4,5,6,7,8,9].map(n => (
                    <KeyButton key={n} color={palette.primary} onPress={() => onDigit(String(n))}>{n}</KeyButton>
                  ))}
                  <KeyButton color={palette.primary} variant="muted" onPress={onDelete}>⌫</KeyButton>
                  <KeyButton color={palette.primary} onPress={() => onDigit('0')}>0</KeyButton>
                  <KeyButton color={palette.primary} variant="action" onPress={onSubmit}>OK</KeyButton>
                </div>
              </>
            )}

            {stage === 'DISARMED' && (
              <>
                <div style={{
                  display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10,
                  fontSize: 11, letterSpacing: '0.2em', opacity: 0.85,
                }}>
                  <span style={{ minWidth: 100 }}>ЧУВСТВ-ТЬ</span>
                  <input
                    type="range" min="0.4" max="4" step="0.1"
                    value={threshold}
                    onChange={(e) => setThreshold(parseFloat(e.target.value))}
                    style={{ flex: 1, accentColor: palette.primary }}
                  />
                  <span style={{ minWidth: 36, textAlign: 'right' }}>{threshold.toFixed(1)}</span>
                </div>

                <div style={{
                  display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14,
                  fontSize: 11, letterSpacing: '0.2em', opacity: 0.85,
                }}>
                  <span style={{ minWidth: 100 }}>ДО СИРЕНЫ</span>
                  <input
                    type="range" min="1" max="30" step="1"
                    value={graceSec}
                    onChange={(e) => setGraceSec(parseInt(e.target.value))}
                    style={{ flex: 1, accentColor: palette.primary }}
                  />
                  <span style={{ minWidth: 36, textAlign: 'right' }}>{graceSec} с</span>
                </div>

                <button onClick={beginArming} style={armButtonStyle(palette.primary)}>
                  ⚠ ПОСТАВИТЬ НА ОХРАНУ
                </button>

                <button
                  onClick={() => { startSiren(); setTimeout(stopSiren, 800); }}
                  style={{ ...secondaryButtonStyle(palette.primary), marginTop: 8 }}
                >
                  ТЕСТ СИРЕНЫ
                </button>

                <button
                  onClick={() => { setSavedPin(null); setPinBuffer(''); setConfirmBuffer(''); setStage('SETUP'); }}
                  style={{ ...secondaryButtonStyle(palette.primary), marginTop: 8, opacity: 0.6 }}
                >
                  СМЕНИТЬ PIN
                </button>
              </>
            )}

            {stage === 'ARMING' && (
              <button onClick={disarm} style={secondaryButtonStyle('#ff5566')}>
                ОТМЕНА
              </button>
            )}

            <div style={{
              marginTop: 16, paddingTop: 10,
              borderTop: `1px solid ${palette.primary}30`,
              fontSize: 10, letterSpacing: '0.25em', opacity: 0.55,
              display: 'flex', justifyContent: 'space-between',
            }}>
              <span>СЕНСОР: {{
                idle: 'НЕ АКТИВЕН',
                requesting: 'ЗАПРОС...',
                active: 'АКТИВЕН',
                denied: 'ОТКАЗАНО',
                unsupported: 'НЕТ',
              }[sensorStatus]}</span>
              <span>PIN: {savedPin ? 'УСТАНОВЛЕН' : '—'}</span>
            </div>
          </div>
        </div>
      );
    }

    function KeyButton({ children, onPress, color, variant }) {
      const bg = variant === 'action' ? `${color}22` : '#0a0a0a';
      const borderColor = variant === 'muted' ? `${color}55` : color;
      return (
        <button
          onClick={onPress}
          style={{
            background: bg,
            border: `1.5px solid ${borderColor}`,
            color: color,
            padding: '18px 0',
            fontSize: 22,
            fontWeight: 700,
            borderRadius: 4,
            textShadow: `0 0 8px ${color}`,
            boxShadow: `inset 0 0 12px ${color}22, 0 0 8px ${color}33`,
            transition: 'all 80ms',
          }}
        >{children}</button>
      );
    }

    function armButtonStyle(color) {
      return {
        width: '100%',
        background: `linear-gradient(180deg, ${color}33 0%, ${color}11 100%)`,
        border: `2px solid ${color}`,
        color: color,
        padding: '18px',
        fontSize: 16,
        fontWeight: 800,
        letterSpacing: '0.25em',
        borderRadius: 4,
        textShadow: `0 0 10px ${color}`,
        boxShadow: `0 0 20px ${color}55, inset 0 0 20px ${color}22`,
      };
    }

    function secondaryButtonStyle(color) {
      return {
        width: '100%',
        background: '#000',
        border: `1px solid ${color}77`,
        color: color,
        padding: '12px',
        fontSize: 12,
        fontWeight: 700,
        letterSpacing: '0.25em',
        borderRadius: 3,
      };
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AntiTheftApp />);
  </script>
</body>
</html>
